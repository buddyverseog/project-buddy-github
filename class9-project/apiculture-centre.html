<style>

#loading-message{
text-align:center;
padding:20px;
font-size:18px;
color:#666;
}

</style>

<div id="loading-message">
📄 Solution PDF is loading...
<br><br>
Please wait a few seconds.
</div>


<div id="pdf-container"></div>



<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const pdfUrl =
"https://raw.githubusercontent.com/buddyverseog/downloads-pb/main/.pdfIXSCH05-P1";

pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {

let pagesLoaded = 0;

for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){

pdf.getPage(pageNum).then(page => {

const scale = 1.5;

const viewport = page.getViewport({
scale: scale
});

const canvas =
document.createElement("canvas");

const context =
canvas.getContext("2d");

canvas.height =
viewport.height;

canvas.width =
viewport.width;

document
.getElementById("pdf-container")
.appendChild(canvas);

page.render({
canvasContext: context,
viewport: viewport
}).promise.then(() => {

pagesLoaded++;

if(pagesLoaded === pdf.numPages){

document
.getElementById("loading-message")
.style.display = "none";

}

});

});

}

}).catch(error => {

document
.getElementById("loading-message")
.innerHTML =
"❌ Unable to load PDF.";

console.error(error);

});

function toggleTheme(){

document.body.classList.toggle("dark");

const btn =
document.querySelector(".theme-btn");

if(document.body.classList.contains("dark")){

btn.innerHTML="☀️";

localStorage.setItem(
"theme",
"dark"
);

document.querySelectorAll("canvas").forEach(c=>{
c.style.filter="invert(1)";
});

}else{

btn.innerHTML="🌙";

localStorage.setItem(
"theme",
"light"
);

document.querySelectorAll("canvas").forEach(c=>{
c.style.filter="none";
});

}

}

window.onload=()=>{

if(localStorage.getItem("theme")==="dark"){

toggleTheme();

}

};

</script>

<script>

function shareProject(){

    const title = document.title;

    const link = window.location.href;

    const message =
    title + "\n\n" + link;

    navigator.clipboard.writeText(link);

    window.open(
        "https://wa.me/?text=" +
        encodeURIComponent(message),
        "_blank"
    );

}

</script>
