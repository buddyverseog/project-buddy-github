<style>

.social-floating{
    position:fixed;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    z-index:9999;

    display:flex;
    flex-direction:column;
    gap:12px;
}

.social-btn{
    width:60px;
    height:60px;

    border-radius:50%;

    background:#ffffff;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 4px 12px rgba(0,0,0,.25);

    transition:.3s;
}

.social-btn:hover{
    transform:scale(1.1);
}

.social-btn img{
    width:34px;
    height:34px;
    object-fit:contain;
}
}

</style>

<script>

function sharePage(){

    if(navigator.share){

        navigator.share({
            title: document.title,
            url: window.location.href
        });

    }else{

        navigator.clipboard.writeText(window.location.href);

        alert("Page link copied!");
    }

}

</script>
